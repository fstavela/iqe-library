default:
  http:
    default_auth_type: basic
    proxy: null
    verify: true
    timeout: 30
    trust_env: true
  vault:
    url: https://vault.devshift.net
    mount_point: insights
    verify: true
    token: null
    role_id: null
    secret_id: null
    oidc_token: null
    oidc_role: Default
    oidc_redirect_uri: http://localhost:8250/oidc/callback
    timeout: 60
  ephemeral:
    namespace: null
stage:
  base_url: https://console.stage.redhat.com
  cert_base_url: https://cert.console.stage.redhat.com
  http:
    proxy: http://squid.corp.redhat.com:3128
    token_url: https://sso.stage.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
prod:
  base_url: https://console.redhat.com
  cert_base_url: https://cert.console.redhat.com
  http:
    token_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
ephemeral:
  base_url: '@jinja https://{{ env_parser.env_hostname }}'
  http:
    token_url: '@jinja {{ env_parser.sso_url }}realms/redhat-external/protocol/openid-connect/token'
    client_id: cloud-services
  keycloak_admin:
    server_url: '@jinja {{ env_parser.sso_url }}'
    username: '@jinja {{ env_parser.sso_admin_username }}'
    password: '@jinja {{ env_parser.sso_admin_password }}'
    realm_name: redhat-external
    user_realm_name: master
    verify: true
    timeout: 30
