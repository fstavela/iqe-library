[project]
name = "iqe-library"
version = "0.1.0.dev0"
description = "Shared tools for testing Red Hat Insights services"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
config = [
    "dynaconf==3.2.13",
    "PyYAML>=6",
    "Jinja2>=3",
    "hvac>=2",
    "requests>=2.32.2",
    "urllib3>=1.26.5",
    "truststore>=0.10",
]
vault = [
    "hvac>=2",
    "requests>=2.32.2",
    "urllib3>=1.26.5",
    "truststore>=0.10",
]
kerberos = ["requests-gssapi"]

[project.urls]
Repository = "https://github.com/fstavela/iqe-library"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.1"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.16.9",
    "types-PyYAML",
    "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["dynaconf.*", "hvac.*", "requests_gssapi"]
ignore_missing_imports = true
